name: Laravel Cloud

# Creates or updates the Laravel Cloud environment (app, MySQL, Valkey,
# scheduler, Horizon worker, variables) and deploys. Safe to run again.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        default: main
        required: true
      region:
        description: Region for new resources
        default: eu-central-1
        required: true
      deploy:
        description: Deploy after provisioning
        type: boolean
        default: true
      first_run:
        description: Start discovery and scraping after deploying
        type: boolean
        default: false
      worker_size:
        description: Instance size for Horizon (empty picks the smallest with 1 GB)
        required: false

permissions:
  contents: read

concurrency:
  group: laravel-cloud
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install the Cloud CLI
        run: |
          composer global require laravel/cloud-cli:0.6.1 --no-interaction --no-progress
          echo "$(composer global config bin-dir --absolute --quiet)" >> "$GITHUB_PATH"

      - name: Provision and deploy
        run: php scripts/cloud-provision.php
        env:
          LARAVEL_CLOUD_TOKEN: ${{ secrets.LARAVEL_CLOUD_TOKEN }}
          CLOUD_REPOSITORY: ${{ github.repository }}
          CLOUD_APP_NAME: ${{ vars.CLOUD_APP_NAME }}
          CLOUD_BRANCH: ${{ inputs.branch }}
          CLOUD_REGION: ${{ inputs.region }}
          CLOUD_WORKER_SIZE: ${{ inputs.worker_size }}
          CLOUD_DEPLOY: ${{ inputs.deploy }}
          CLOUD_FIRST_RUN: ${{ inputs.first_run }}
          RADAR_BASIC_AUTH_USER: ${{ vars.RADAR_BASIC_AUTH_USER }}
          RADAR_BASIC_AUTH_PASSWORD: ${{ secrets.RADAR_BASIC_AUTH_PASSWORD }}
          RADAR_USER_AGENT: ${{ vars.RADAR_USER_AGENT }}
          RADAR_SEARCH_API_KEY: ${{ secrets.RADAR_SEARCH_API_KEY }}
